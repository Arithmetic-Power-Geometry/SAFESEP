name: WI-BRAC world-dependent closure
on:
  push:
    branches: [wi-brac-world-dependent-v1]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: python scripts/wi_brac_census.py
      - run: python scripts/wi_brac_random_census.py
