name: Android emulator authority sanity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-probe/**'
      - '.github/workflows/android-emulator-sanity.yml'

jobs:
  permission-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run synthetic permission transition
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash android-probe/run_permission_sanity.sh
      - name: Upload sanity record
        uses: actions/upload-artifact@v4
        with:
          name: android-permission-sanity
          path: android-probe/out/permission-sanity.txt
