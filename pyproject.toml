[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safesep"
version = "0.1.0"
description = "Safe Separability for Autonomous Authorization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
